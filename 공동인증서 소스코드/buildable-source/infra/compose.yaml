name: vision-certi-dev
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: vision_certi
      POSTGRES_USER: certi_migration
      POSTGRES_PASSWORD: ${CERTI_DEV_DB_PASSWORD:?Set CERTI_DEV_DB_PASSWORD for local development}
    ports:
      - '127.0.0.1:55432:5432'
    volumes:
      - pgdata:/var/lib/postgresql
      - ../database/migrations:/docker-entrypoint-initdb.d:ro
      - ../database/tests:/tests:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U certi_migration -d vision_certi']
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  pgdata:
