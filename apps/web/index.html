    <script>
      const host = location.hostname;
      if (host === 'vision-certi.firebaseapp.com' ||
          host === 'hahattalk-vision-certi.web.app' ||
          host === 'hahattalk-vision-certi.firebaseapp.com' ||
          /^hahattalk-vision-certi--[a-z0-9-]+\.web\.app$/.test(host)) {
        location.replace('https://vision-certi.web.app' + location.pathname + location.search + location.hash);
      }
    </script>
